<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RecipeApp – Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="alert-container"></div>

    <main class="auth-page">
      <div class="auth-card">
        <div class="auth-logo">
          <!-- SVG Logo: olive branch + pot -->
          <svg
            width="56"
            height="56"
            viewBox="0 0 56 56"
            fill="none"
            aria-label="RecipeApp logo"
          >
            <circle
              cx="28"
              cy="28"
              r="28"
              fill="var(--color-primary-highlight)"
            />
            <path
              d="M18 34 C18 28 22 22 28 20 C34 22 38 28 38 34"
              stroke="var(--color-primary)"
              stroke-width="2.5"
              stroke-linecap="round"
              fill="none"
            />
            <rect
              x="16"
              y="34"
              width="24"
              height="4"
              rx="2"
              fill="var(--color-primary)"
            />
            <path
              d="M24 20 C24 16 20 14 20 14"
              stroke="var(--color-accent)"
              stroke-width="2"
              stroke-linecap="round"
            />
            <circle cx="20" cy="13" r="2" fill="var(--color-accent)" />
            <path
              d="M32 20 C32 16 36 14 36 14"
              stroke="var(--color-accent)"
              stroke-width="2"
              stroke-linecap="round"
            />
            <circle cx="36" cy="13" r="2" fill="var(--color-accent)" />
          </svg>
          <h1>Reciplan</h1>
          <p>Cook with all you got</p>
        </div>

        <div class="tabs">
          <button class="tab-btn active" data-tab="login">Sign In</button>
          <button class="tab-btn" data-tab="register">Register</button>
        </div>

        <!-- LOGIN PANEL -->
        <div class="tab-panel active" id="tab-login">
          <form id="login-form" novalidate>
            <div class="form-group">
              <label class="form-label" for="login-email"
                >Email <span class="required">*</span></label
              >
              <input
                class="form-control"
                type="email"
                id="login-email"
                placeholder="your@email.com"
                autocomplete="email"
                required
              />
            </div>
            <div class="form-group">
              <label class="form-label" for="login-password"
                >Password <span class="required">*</span></label
              >
              <input
                class="form-control"
                type="password"
                id="login-password"
                placeholder="••••••••"
                autocomplete="current-password"
                required
              />
            </div>
            <button
              type="submit"
              class="btn btn-primary btn-full"
              id="login-btn"
            >
              Sign In
            </button>
          </form>
        </div>

        <!-- REGISTER PANEL -->
        <div class="tab-panel" id="tab-register">
          <form id="register-form" novalidate>
            <div class="form-group">
              <label class="form-label" for="reg-username"
                >Username <span class="required">*</span></label
              >
              <input
                class="form-control"
                type="text"
                id="reg-username"
                placeholder="min 3 characters"
                autocomplete="username"
                required
                minlength="3"
                maxlength="50"
              />
            </div>
            <div class="form-group">
              <label class="form-label" for="reg-email"
                >Email <span class="required">*</span></label
              >
              <input
                class="form-control"
                type="email"
                id="reg-email"
                placeholder="your@email.com"
                autocomplete="email"
                required
              />
            </div>
            <div class="form-group">
              <label class="form-label" for="reg-password"
                >Password <span class="required">*</span></label
              >
              <input
                class="form-control"
                type="password"
                id="reg-password"
                placeholder="min 8 characters"
                autocomplete="new-password"
                required
                minlength="8"
              />
            </div>
            <button
              type="submit"
              class="btn btn-primary btn-full"
              id="register-btn"
            >
              Create Account
            </button>
          </form>
        </div>
      </div>
    </main>

    <script src="api.js"></script>
    <script src="app.js"></script>
    <script>
      redirectIfLoggedIn();

      // ── Tabs ──────────────────────────────────────────────────────────────
      document.querySelectorAll(".tab-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll(".tab-btn, .tab-panel")
            .forEach((el) => el.classList.remove("active"));
          btn.classList.add("active");
          document
            .getElementById("tab-" + btn.dataset.tab)
            .classList.add("active");
        });
      });

      // ── Login ─────────────────────────────────────────────────────────────
      document
        .getElementById("login-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const btn = document.getElementById("login-btn");
          btn.disabled = true;
          btn.textContent = "Signing in…";
          try {
            const res = await Auth.login(
              document.getElementById("login-email").value.trim(),
              document.getElementById("login-password").value,
            );
            saveAuth(res.token, res.username, res.role);
            // Fetch user id
            const me = await request("GET", "/users/me");
            saveUserId(me.id);
            window.location.href = "dashboard.html";
          } catch (err) {
            showAlert(err.message, "error");
            btn.disabled = false;
            btn.textContent = "Sign In";
          }
        });

      // ── Register ──────────────────────────────────────────────────────────
      document
        .getElementById("register-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const btn = document.getElementById("register-btn");
          btn.disabled = true;
          btn.textContent = "Creating account…";
          try {
            const res = await Auth.register(
              document.getElementById("reg-username").value.trim(),
              document.getElementById("reg-email").value.trim(),
              document.getElementById("reg-password").value,
            );
            saveAuth(res.token, res.username, res.role);
            const me = await request("GET", "/users/me");
            saveUserId(me.id);
            window.location.href = "dashboard.html";
          } catch (err) {
            showAlert(err.message, "error");
            btn.disabled = false;
            btn.textContent = "Create Account";
          }
        });
    </script>
  </body>
</html>
