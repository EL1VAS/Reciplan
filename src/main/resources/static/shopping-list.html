<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopping List – RecipeApp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<script src="api.js"></script>
<script src="app.js"></script>
<script>
requireAuth();
renderShell('Shopping List');

let currentPage = 0;
let allIngredients = [];

document.getElementById('page-content').innerHTML = `
  <div class="page-header" style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:var(--space-4)">
    <div>
      <h1 class="page-title">Shopping List</h1>
      <p class="page-subtitle">Check off items as you shop</p>
    </div>
    <div style="display:flex;gap:var(--space-3);flex-wrap:wrap">
      <button class="btn btn-secondary btn-sm" id="btn-clear-checked">Clear Checked</button>
      <button class="btn btn-danger btn-sm" id="btn-clear-all">Clear All</button>
      <button class="btn btn-primary" id="btn-add-item">+ Add Item</button>
    </div>
  </div>

  <!-- Progress bar -->
  <div id="progress-section" style="margin-bottom:var(--space-6);display:none">
    <div style="display:flex;justify-content:space-between;font-size:var(--text-sm);color:var(--color-text-muted);margin-bottom:var(--space-2)">
      <span id="progress-label">0 of 0 items checked</span>
      <span id="progress-pct">0%</span>
    </div>
    <div class="match-bar-wrap"><div class="match-bar" id="progress-bar" style="width:0%"></div></div>
  </div>

  <div id="shopping-container"></div>
  <div id="shopping-pagination"></div>

  <!-- Add Item Modal -->
  <div class="modal-backdrop" id="modal-shopping-form">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">Add to Shopping List</h2>
        <button class="btn btn-ghost btn-icon" onclick="closeModal('modal-shopping-form')" aria-label="Close">✕</button>
      </div>
      <div class="modal-body">
        <form id="shopping-form" novalidate>
          <div class="form-group">
            <label class="form-label">Ingredient <span class="required">*</span></label>
            <select class="form-control" id="sf-ingredient" required>
              <option value="">Select ingredient…</option>
            </select>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Quantity <span class="required">*</span></label>
              <input class="form-control" type="number" id="sf-quantity" min="0.01" step="0.01" placeholder="e.g. 200" required>
            </div>
            <div class="form-group">
              <label class="form-label">Unit <span class="required">*</span></label>
              <select class="form-control" id="sf-unit">${unitOptions('GRAM')}</select>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('modal-shopping-form')">Cancel</button>
        <button class="btn btn-primary" id="btn-save-shopping">Add Item</button>
      </div>
    </div>
  </div>
`;

async function loadIngredients() {
  try {
    let page = 0, all = [];
    while (true) {
      const res = await Ingredients.getAll(page, 100);
      all = all.concat(res.content);
      if (res.last) break; page++;
    }
    allIngredients = all;
    const sel = document.getElementById('sf-ingredient');
    sel.innerHTML = '<option value="">Select ingredient…</option>' +
      all.map(i => `<option value="${i.id}">${i.name} (${i.categoryName})</option>`).join('');
  } catch(e) {}
}

function updateProgress(items) {
  const total = items.length;
  const checked = items.filter(i => i.checked).length;
  const pct = total ? Math.round((checked / total) * 100) : 0;
  const section = document.getElementById('progress-section');
  if (total > 0) {
    section.style.display = 'block';
    document.getElementById('progress-label').textContent = `${checked} of ${total} items checked`;
    document.getElementById('progress-pct').textContent = `${pct}%`;
    document.getElementById('progress-bar').style.width = pct + '%';
  } else {
    section.style.display = 'none';
  }
}

function renderItems(items) {
  if (!items.length) return emptyState('Your shopping list is empty. Add items or generate from a recipe!', '🛒');
  return `<div class="item-list">${items.map(item => `
    <div class="item-row ${item.checked ? 'checked' : ''}" id="row-${item.id}">
      <input type="checkbox" ${item.checked ? 'checked' : ''}
        style="width:1.2rem;height:1.2rem;accent-color:var(--color-primary);cursor:pointer;flex-shrink:0"
        onchange="toggleItem(${item.id}, this)"
        aria-label="Check ${item.ingredientName}">
      <div style="flex:1">
        <div class="item-name">${item.ingredientName}</div>
        <div class="item-meta">${item.categoryName}</div>
      </div>
      <div class="item-qty">${item.quantity} ${item.unit}</div>
      <div class="item-actions">
        <button class="btn btn-danger btn-sm btn-icon" onclick="deleteItem(${item.id})" aria-label="Delete">🗑</button>
      </div>
    </div>`).join('')}</div>`;
}

// Keep a local cache of all items for progress bar
let allItems = [];

async function loadShopping(page = 0) {
  const userId = getUserId();
  if (!userId) { document.getElementById('shopping-container').innerHTML = emptyState('User session not found. Please log in again.', '🔒'); return; }
  const container = document.getElementById('shopping-container');
  container.innerHTML = `<div class="item-list">${Array(4).fill(`<div class="item-row"><div class="skeleton skeleton-line" style="flex:1;height:1.2em"></div></div>`).join('')}</div>`;
  try {
    const data = await ShoppingList.getAll(userId, page);
    currentPage = page;
    allItems = data.content || [];
    updateProgress(allItems);
    container.innerHTML = renderItems(allItems);
    renderPagination(data, 'shopping-pagination', loadShopping);
  } catch(e) {
    container.innerHTML = emptyState('Failed to load shopping list.', '⚠️');
    showAlert(e.message, 'error');
  }
}

async function toggleItem(itemId, checkbox) {
  const userId = getUserId();
  const row = document.getElementById('row-' + itemId);
  try {
    const updated = await ShoppingList.toggle(userId, itemId);
    if (updated.checked) row.classList.add('checked');
    else row.classList.remove('checked');
    // update local cache
    const item = allItems.find(i => i.id === itemId);
    if (item) item.checked = updated.checked;
    updateProgress(allItems);
  } catch(e) {
    checkbox.checked = !checkbox.checked; // revert
    showAlert(e.message, 'error');
  }
}

async function deleteItem(itemId) {
  if (!confirm('Remove this item?')) return;
  try {
    await ShoppingList.delete(getUserId(), itemId);
    showAlert('Item removed', 'success');
    loadShopping(currentPage);
  } catch(e) { showAlert(e.message, 'error'); }
}

document.getElementById('btn-add-item').addEventListener('click', () => {
  document.getElementById('shopping-form').reset();
  document.getElementById('sf-unit').innerHTML = unitOptions('GRAM');
  openModal('modal-shopping-form');
});

document.getElementById('btn-save-shopping').addEventListener('click', async () => {
  const ingId = +document.getElementById('sf-ingredient').value;
  const qty   = parseFloat(document.getElementById('sf-quantity').value);
  const unit  = document.getElementById('sf-unit').value;
  if (!ingId) { showAlert('Select an ingredient', 'error'); return; }
  if (!qty || qty <= 0) { showAlert('Enter a valid quantity', 'error'); return; }

  const btn = document.getElementById('btn-save-shopping');
  btn.disabled = true; btn.textContent = 'Adding…';
  try {
    await ShoppingList.add(getUserId(), { ingredientId: ingId, quantity: qty, unit });
    showAlert('Item added!', 'success');
    closeModal('modal-shopping-form');
    loadShopping(currentPage);
  } catch(e) {
    showAlert(e.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Add Item';
  }
});

document.getElementById('btn-clear-checked').addEventListener('click', async () => {
  if (!confirm('Remove all checked items?')) return;
  try {
    await ShoppingList.clearChecked(getUserId());
    showAlert('Checked items cleared!', 'success');
    loadShopping(0);
  } catch(e) { showAlert(e.message, 'error'); }
});

document.getElementById('btn-clear-all').addEventListener('click', async () => {
  if (!confirm('Clear your entire shopping list?')) return;
  try {
    await ShoppingList.clearAll(getUserId());
    showAlert('Shopping list cleared!', 'success');
    loadShopping(0);
  } catch(e) { showAlert(e.message, 'error'); }
});

loadIngredients();
loadShopping(0);
</script>
</body>
</html>
